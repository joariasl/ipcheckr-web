<div>
    <div class="title-section">
        <h1>Your public IP</h1>
        <div class="header-actions">
            <div id="connection-status" class="connection-status">
                <span class="connection-indicator"></span>
                <span class="connection-text">Online</span>
            </div>
            <button id="refresh-button" class="refresh-button" type="button" aria-label="Reload page">
                &#8634;
            </button>
        </div>
    </div>
    <div class="card">
        <article id="ipv4" class="info-card ip-card">
        <div class="info-header">
            <h2>IPv4</h2>
            <span class="status"></span>
        </div>
        <span class="ip-address">-- -- -- --</span>
        <table class="ip-resolution-records"><tbody></tbody></table>
        </article>
        <article id="ipv6" class="info-card ip-card">
        <div class="info-header">
            <h2>IPv6</h2>
            <span class="status"></span>
        </div>
        <span class="ip-address">-- -- -- -- -- --</span>
        <table class="ip-resolution-records"><tbody></tbody></table>
        </article>
        <article id="user-agent" class="info-card">
        <div class="info-header">
            <h2>User Agent</h2>
        </div>
        </article>
    </div>
</div>
